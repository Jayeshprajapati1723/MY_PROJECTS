<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>circular loader</title>
<style>
    .bg{
        margin-left: 50%;
        margin-top: 50%;
        height:100px ;width: 100px;
    }
    .circle{
        height: 50px ;width: 50px ;
        border-radius:  50%;
        border: 2px dotted rgb(0, 255, 183) ;   
    }

    .circle:hover{
        border : 5px dotted rgb(15, 5, 5) ;
         animation: spin 1s linear infinite;
         
    }

    @keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>
</head>
<body>
    <div class="bg">
        <div class="circle">

        </div>

    </div>
    
</body>
</html>
