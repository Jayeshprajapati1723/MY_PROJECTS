<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>live char counter</title>
    <style>
      /* h1{
    text-align: center;
} */

      body {
        background-color: rgb(0, 0, 0);
        color: white;
      }
      input:hover {
        border-color: blue;
      }

      /* span {
        font-size: larger;
      } */
      input {
        margin-top: 20px;
        color: black;
        text-indent: 5px;
        position: absolute;
        left: 200px;
        height: 40px;
        width: 400px;
        /* border-radius: 20%; */
        padding: 2px 2px 2px 2px;
        border: 5px solid aqua;
      }
      h1 {
        position: relative;

        left: 200px;
        top: 100px;
        font-family: Arial, Helvetica, sans-serif;
      }
      h2 {
        color: aqua;
        position: relative;
        left: 200px;
        text-transform: capitalize;
        font-family: cursive;
      }
    </style>
  </head>
  <body>
    <h2><b>lIVE CHARACTER COUNTER</b></h2>

    <input type="text" placeholder="type something" />
    <h1>Total character : <span>0</span></h1>
    <h1>Total character left : <span class="left">20</span></h1>
  </body>
  <script>
    let inputs = document.querySelector("input");
    let span = document.querySelector("span");

    let ct = 0;
    inputs.addEventListener("input", function (detail) {
      console.log(detail);

      ct = inputs.value.length;
      let leftchar = 20 - ct;
      if (leftchar <= 20) {
        //ap warning do y input text rok do
        let l = document.querySelector(".left");
        l.textContent = " " + leftchar + " are left";
        l.style.color = "green";
        if (leftchar < 0) {
          l.textContent = leftchar + " limit exceeded !";
          l.style.color = "red";
        }
      }

      console.log(ct);
      span.textContent = ct;
    });
  </script>
</html>
